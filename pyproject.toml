[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "ledger"
version = "0.1.0"
description = "LEDGER: a two-agent contracting economy for language-model agents (M0 vertical slice)"
requires-python = ">=3.10"
dependencies = []

[project.optional-dependencies]
dev = ["pytest", "hypothesis", "tiktoken"]
runtime = ["requests"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "token_bounds: tests that require the tiktoken o200k_base tokenizer",
]
